{% extends 'base.html' %}

{% block body_content %}
<div style="max-width: 400px; margin: 3rem auto; background: var(--bg-card); padding: 2rem; border-radius: 10px; border: 1px solid var(--border-color);">
    <h2 style="color: var(--accent-gold); text-align: center; margin-bottom: 1.5rem;">Create Account</h2>
    
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-auth" style="width: 100%; border: none; cursor: pointer; padding: 0.7rem; margin-top: 1rem; font-size: 1rem;">Sign Up</button>
    </form>
</div>
{% endblock %}
