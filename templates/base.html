{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block page_title %}HarryBlog{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body>

    <header>
        <div class="logo">
            <a href="{% url 'home' %}">⚡ HarryBlog</a>
        </div>
        <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'all-posts' %}">All Posts</a>
            
            {% if user.is_authenticated %}
                <span style="color: var(--accent-gold);">Hi, {{ user.username }}</span>
                {% if user.is_staff %}
                    <a href="{% url 'admin:index' %}">Admin Panel</a>
                {% endif %}
                <form action="{% url 'logout' %}" method="post" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" style="background:none; border:none; color:var(--accent-gold); cursor:pointer; font-size:inherit;">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'signup' %}" class="btn-auth">Sign Up</a>
            {% endif %}
        </nav>
    </header>

    <main style="max-width: 950px; margin: 2rem auto; padding: 0 1rem;">
        {% block body_content %}
        {% endblock %}
    </main>

</body>
</html>
